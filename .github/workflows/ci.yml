name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  STOCKFISH_TAG: sf_19

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official Stockfish
        run: |
          curl -fsSL -o sf.tar.gz "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_TAG}/stockfish-linux-x86-64-universal.tar.gz"
          mkdir -p "$HOME/sf" && tar -xzf sf.tar.gz -C "$HOME/sf" --strip-components=1
          echo "STOCKFISH_PATH=$HOME/sf/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - name: Python tests (FastAPI + Streamlit + real Stockfish download)
        env:
          RUN_NETWORK_TESTS: "1"
        run: python -m pytest -q
      - name: UI smoke test (real server + real Stockfish)
        run: |
          uvicorn app.main:app --port 8765 --log-level warning &
          sleep 4
          cd tests/ui && npm ci && BASE=http://127.0.0.1:8765 node ui_smoke.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chess-review .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name cr -p 8000:8000 chess-review
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"stockfish":true'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs cr; exit 1
